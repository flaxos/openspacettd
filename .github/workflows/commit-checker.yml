name: Commit checker

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  commit-checker:
    name: Commit checker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Checking each commit's diff requires its parent, even when a merge base is already available.
        fetch-depth: 0

    - name: Get pull-request commits
      uses: OpenTTD/actions/checkout-pull-request@v7

    - name: Checkout upstream commit validators
      uses: actions/checkout@v7
      with:
        repository: OpenTTD/OpenTTD-git-hooks
        ref: main
        path: .git-hooks
        persist-credentials: false

    - name: Check commits
      run: |
        echo "::add-matcher::${{ github.workspace }}/.git-hooks/action/check-diff-matcher.json"
        echo "::add-matcher::${{ github.workspace }}/.git-hooks/action/check-message-matcher.json"
        python3 .github/check-pr-commits.py --hooks .git-hooks/hooks
