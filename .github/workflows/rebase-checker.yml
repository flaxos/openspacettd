name: "Update 'work: needs rebase' label status"
on:
  # So that PRs touching the same files as the push are updated
  push:
  # So that the `dirtyLabel` is removed if conflicts are resolve
  # Label fork PRs in target context; never check out or execute PR code here.
  pull_request_target:
    types: [synchronize]

permissions: {}

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: check if prs are in need of a rebase
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3
        with:
          dirtyLabel: "work: needs rebase"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
